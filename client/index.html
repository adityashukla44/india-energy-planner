<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09080E" />
    <meta name="description" content="Pick an Indian district, see its energy profile, and design and price a reliable solar, wind, hydro, battery and diesel system." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>India Energy Planner</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('iep-store') || '{}');
        var t = s && s.state && s.state.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
